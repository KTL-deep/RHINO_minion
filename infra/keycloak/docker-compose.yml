services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-before-use}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/rhino-minion-realm.json:ro
      - keycloak_data:/opt/keycloak/data

volumes:
  keycloak_data:
